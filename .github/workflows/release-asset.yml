name: Create Release Asset

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースタグ（例: v0.2.0）'
        required: true

permissions:
  contents: write

jobs:
  release-asset:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Create template zip
        run: |
          OUTFILE="scholist-${TAG}-template.zip"
          WORKDIR="${PWD}"
          TMPDIR=$(mktemp -d)

          # ツールファイルをコピー
          cp -r build.py templates/ static/ data/ \
                requirements.txt pyproject.toml \
                README.md README.en.md CHANGELOG.md LICENSE .gitignore "${TMPDIR}/"

          # GitHub Actions ワークフローをコピー
          mkdir -p "${TMPDIR}/.github/workflows"
          cp .github/workflows/build.yml "${TMPDIR}/.github/workflows/"
          cp extras/sync-from-scholist.yml "${TMPDIR}/.github/workflows/"

          # zip を生成
          cd "${TMPDIR}"
          zip -r "${WORKDIR}/${OUTFILE}" .
          cd "${WORKDIR}"

          echo "OUTFILE=${OUTFILE}" >> $GITHUB_ENV

      - name: Create or update release with asset
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${OUTFILE}" --clobber
          else
            gh release create "${TAG}" "${OUTFILE}" \
              --title "scholist ${TAG}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
